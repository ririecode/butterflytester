<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color it. Scan it. Watch it fly.</title>
<style>
:root{--ink:#1f1b3a;--sky:#e8f0ff;--pink:#ff5c8a;--blue:#3a7bff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 16px 40px;background:var(--sky);color:var(--ink);font:16px/1.5 ui-rounded,"Trebuchet MS",system-ui,sans-serif}
h1{font-size:1.7rem;line-height:1.15;margin:.1em 0 .2em;text-align:center}
.sub{margin:0 0 18px;text-align:center;max-width:30em;opacity:.8}
.stage{position:relative;width:min(92vw,400px);aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 10px 34px #1f1b3a2e}
.stage canvas,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:10px;border:3px dashed #ffffffd0;border-radius:14px;pointer-events:none;box-shadow:0 0 0 2px #1f1b3a55}
.hint{margin:12px 0 0;text-align:center;font-size:.95rem;max-width:26em}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btn{appearance:none;border:2px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer}
.btn.main{background:var(--pink);border-color:var(--pink);color:#fff}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<h1>Color it. Scan it. Watch it fly.</h1>
<p class="sub">Print the page, color it in, then snap a photo. Your colors come alive on screen.</p>

<main id="home">
  <div class="stage"><canvas id="prev" width="600" height="800"></canvas></div>
  <div class="row">
    <button class="btn" id="dl">Download page to print</button>
    <button class="btn main" id="cam">Scan my coloring</button>
  </div>
  <div class="row">
    <label class="btn">Upload a photo<input id="file" type="file" accept="image/*" hidden></label>
    <button class="btn" id="demo">Try a sample</button>
  </div>
</main>

<main id="camv" hidden>
  <div class="stage"><video id="vid" playsinline muted></video><div class="frame"></div></div>
  <p class="hint">Fit the printed page inside the dashed frame, in good light, then tap Capture.</p>
  <div class="row"><button class="btn" id="cancel">Back</button><button class="btn main" id="snap">Capture</button></div>
</main>

<main id="animv" hidden>
  <div class="stage"><canvas id="cv" width="600" height="800"></canvas></div>
  <div class="row"><button class="btn" id="back">Scan another</button></div>
</main>

<script>
const W=600,H=800,CX=300,$=id=>document.getElementById(id);
const mk=()=>{const k=document.createElement('canvas');k.width=W;k.height=H;return k};

/* ---- Shapes: edit these to change the drawing. Masks and line art share them. ---- */
const L=new Path2D();                       // left wing (two lobes)
L.moveTo(300,330);L.bezierCurveTo(250,190,110,140,65,200);L.bezierCurveTo(30,260,100,370,300,385);L.closePath();
L.moveTo(300,392);L.bezierCurveTo(200,392,115,430,125,515);L.bezierCurveTo(135,580,240,570,300,455);L.closePath();
const R=new Path2D();R.addPath(L,new DOMMatrix([-1,0,0,1,W,0])); // right wing = mirror
const B=new Path2D();B.ellipse(CX,385,15,100,0,0,Math.PI*2);     // body
const spots=[[165,265,38],[190,495,26],[435,265,38],[410,495,26]];

function drawTemplate(c,filled){
  c.fillStyle='#fff';c.fillRect(0,0,W,H);
  if(filled){
    const g=c.createLinearGradient(0,150,0,580);g.addColorStop(0,'#ff9a3c');g.addColorStop(1,'#ff4f8b');
    c.fillStyle=g;c.fill(L);c.fill(R);
    c.fillStyle='#ffe066';spots.forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,7);c.fill()});
    c.fillStyle='#5b3cc4';c.fill(B);
  }
  c.strokeStyle='#000';c.lineWidth=6;c.lineJoin=c.lineCap='round';
  c.strokeRect(12,12,W-24,H-24);
  [L,R,B].forEach(p=>c.stroke(p));
  spots.forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,7);c.stroke()});
  c.beginPath();c.moveTo(300,290);c.quadraticCurveTo(280,230,245,205);c.moveTo(300,290);c.quadraticCurveTo(320,230,355,205);c.stroke();
  c.font='bold 24px sans-serif';c.textAlign='center';c.fillStyle='#000';c.fillText('Color me, then scan!',CX,H-42);
}
drawTemplate($('prev').getContext('2d'));

/* ---- Screens ---- */
const screens={home:$('home'),camv:$('camv'),animv:$('animv')};
const show=n=>{for(const k in screens)screens[k].hidden=k!==n};

/* ---- Capture: center-crop a 3:4 area, matching the on-screen frame ---- */
function grab(src,sw,sh){
  const k=mk();let w=sh*.75,h=sh,x=(sw-w)/2,y=0;
  if(w>sw){w=sw;h=sw/.75;x=0;y=(sh-h)/2}
  k.getContext('2d').drawImage(src,x,y,w,h,0,0,W,H);return k;
}
let stream;
const stopCam=()=>stream&&stream.getTracks().forEach(t=>t.stop());
$('cam').onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
    $('vid').srcObject=stream;await $('vid').play();show('camv');
  }catch(e){alert('The camera is not available here. Use "Upload a photo" instead.')}
};
$('cancel').onclick=()=>{stopCam();show('home')};
$('snap').onclick=()=>{const v=$('vid');const k=grab(v,v.videoWidth,v.videoHeight);stopCam();play(k)};
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const b=await createImageBitmap(f);play(grab(b,b.width,b.height));e.target.value='';
};
$('demo').onclick=()=>{const k=mk();drawTemplate(k.getContext('2d'),true);play(k)};
$('dl').onclick=()=>{
  const k=mk();drawTemplate(k.getContext('2d'));
  k.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='coloring-page.png';a.click()});
};
$('back').onclick=()=>{cancelAnimationFrame(raf);show('home')};

/* ---- Animation ---- */
const cv=$('cv'),cx=cv.getContext('2d');
let photo,raf,t0,sparks=[];
function play(k){photo=k;sparks=[];show('animv');cancelAnimationFrame(raf);t0=performance.now();raf=requestAnimationFrame(loop)}

function wing(p,s){
  cx.save();cx.translate(CX,0);cx.scale(s,1);cx.translate(-CX,0);   // flap = squeeze toward the body
  cx.save();cx.clip(p);cx.drawImage(photo,0,0);cx.restore();
  cx.strokeStyle='#000';cx.lineWidth=6;cx.lineJoin='round';cx.stroke(p);
  cx.restore();
}
function loop(now){
  const t=(now-t0)/1000;
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fd3ff');g.addColorStop(1,'#e0f7d0');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle='#ffffffcc';                                          // drifting clouds
  [[.0,120,70],[.5,260,50],[.8,60,60]].forEach(([o,y,r])=>{
    const x=((t*18+o*W*1.6)%(W+240))-120;
    [0,40,-40].forEach((d,i)=>{cx.beginPath();cx.arc(x+d,y+(i?8:0),r*(i?.7:1),0,7);cx.fill()});
  });
  const px=Math.sin(t*.8)*70,py=Math.cos(t*1.2)*45-20,rot=Math.sin(t*.8)*.12,flap=.55+.45*Math.cos(t*8);
  if(Math.random()<.5)sparks.push({x:CX+px+(Math.random()-.5)*260,y:400+py+(Math.random()-.5)*140,vy:-.4-Math.random(),l:1});
  sparks=sparks.filter(s=>s.l>0);
  sparks.forEach(s=>{s.y+=s.vy;s.l-=.015;cx.globalAlpha=Math.max(s.l,0);cx.fillStyle='#fff7a8';cx.beginPath();cx.arc(s.x,s.y,4*s.l+1,0,7);cx.fill()});
  cx.globalAlpha=1;
  cx.save();cx.translate(CX+px,400+py);cx.rotate(rot);cx.scale(.85,.85);cx.translate(-CX,-400);
  wing(L,flap);wing(R,flap);
  cx.save();cx.clip(B);cx.drawImage(photo,0,0);cx.restore();
  cx.strokeStyle='#000';cx.lineWidth=6;cx.lineCap='round';cx.stroke(B);
  const w=Math.sin(t*5)*8;                                          // antennae
  cx.beginPath();cx.moveTo(300,290);cx.quadraticCurveTo(280,230,245+w,205);cx.moveTo(300,290);cx.quadraticCurveTo(320,230,355+w,205);cx.stroke();
  cx.restore();
  raf=requestAnimationFrame(loop);
}
</script>
</body>
</html>
